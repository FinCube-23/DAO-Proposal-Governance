services:
  dao-app:
    container_name: dao_service_api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV
    ports:
      - '3002:3000'
    volumes:
      #- .:/app # Mount dao-service code
      - ./src:/app/src              # Only sync source code
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./logs:/app/logs

    env_file:
      - .env.local
    networks:
      - fincube23_network

  dao-service-pgsqldb:
    container_name: dao-service-pgsqldb
    image: postgres:16
    env_file:
      - .env.local
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fincube23_network

volumes:
  postgres-data:

networks:
  fincube23_network:
    external: true
