services:
  audit-app:
    container_name: audit_service_api
    build:
      context: ./
      args:
        - APP_ENV=${APP_ENV}
    ports:
      - 3003:3000
    volumes:
      - ./src:/app/src              # Only sync source code
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./logs:/app/logs

    env_file:
      # Add this line to specify the environment file
      - .env # Specify the path to your .env file
    networks:
      - fincube23_network

  audit-trail-pgsqldb:
    container_name: audit-trail-pgsqldb
    image: postgres:16
    env_file:
      - .env
    ports:
      - 5434:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fincube23_network

  pgadmin:
    container_name: pgadmin4-audit-trail
    image: dpage/pgadmin4:8.0
    env_file:
      - .env
    ports:
      - '5070:80'
    depends_on:
      - audit-trail-pgsqldb
    networks:
      - fincube23_network

volumes:
  postgres-data:

networks:
  fincube23_network:
    external: true
