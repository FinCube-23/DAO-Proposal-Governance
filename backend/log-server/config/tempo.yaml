stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 2m # Reduced from 5m for faster processing during high load

compactor:
  compaction:
    block_retention: 0s

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095 # required for localblocks processor

query_frontend:
  search:
    duration_slo: 10s # Increased timeout for queries during heavy load

metrics_generator:
  processor:
    service_graphs:
      wait: 10s
    span_metrics:
      enable_target_info: true
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    # Commented out remote_write until Prometheus is available
    # remote_write:
    #   - url: http://prometheus:9090/api/v1/write
    #     send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

overrides:
  # Moderate increase - enough for k6 testing but safer
  ingestion_rate_limit_bytes: 1000000000 # 500 MB/sec (2x original)
  ingestion_burst_size_bytes: 1500000000 # 800 MB burst (2.5x original)
  max_bytes_per_trace: 100000000 # Keep 80 MB per trace
  # Add per-tenant limits for safety
  max_traces_per_user: 5000 # Limit traces per service
  metrics_generator_processors:
    - service-graphs
    - span-metrics
