stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 180s

compactor:
  compaction:
    block_retention: 30m

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095 # required for localblocks processor

query_frontend:
  search:
    duration_slo: 5s # Increased timeout for queries during heavy load

metrics_generator:
  processor:
    service_graphs:
      wait: 10s
    span_metrics:
      enable_target_info: true
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    # remote_write:
    #   - url: http://prometheus:9090/api/v1/write
    #     send_exemplars: true
  traces_storage:
    path: /var/tempo/wal

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  # Moderate increase - enough for k6 testing but safer
  ingestion_rate_limit_bytes: 200000000   # 200 MB/sec (safe, not heavy)
  ingestion_burst_size_bytes: 400000000   # 400 MB burst allowed
  max_bytes_per_trace: 20000000           # 20 MB max per trace
  # Add per-tenant limits for safety
  max_traces_per_user: 1000               # limit per service/user
  metrics_generator_processors:
    - service-graphs
    - span-metrics
    - local-blocks
