version: "3.8"

services:
  user-management-service:
    container_name: user-management-api
    build: .
    ports:
      - "3001:8000" # External:3001 → Internal:8000
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=rabbitmq # Connects to existing container
      - RABBITMQ_PORT=5672
    networks:
      - fincube23_network

  user-management-pgsqldb:
    container_name: user-management-pgsqldb
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fincube23_network

volumes:
  postgres_data:

networks:
  fincube23_network:
    external: true
