specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FincubeTesting
    network: sepolia
    source:
      address: "0x5202ca1edcbb5a8869d27ae02b5ec41f7f37facf"
      abi: FincubeTesting
      startBlock: 8982308
      # The stress-test dataset ends at block 9010493; stop indexing shortly after it
      # so graph-node does not keep scanning toward the Sepolia chain head.
      endBlock: 9010600
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProposalAdded
      abis:
        - name: FincubeTesting
          file: ./abis/FincubeTesting.json
      eventHandlers:
        - event: ProposalAdded(indexed uint8,indexed uint256,bytes)
          handler: handleProposalAdded
      file: ./src/fincube-testing.ts
