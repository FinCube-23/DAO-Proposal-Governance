name: Remote SSH
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            echo "=== Setting up Node.js environment ==="
            export NVM_DIR="/home/web3/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            export PATH="/home/web3/.nvm/versions/node/v22.13.1/bin:$PATH"
            echo "=== Verifying Node.js tools ==="
            which node npm pm2
            node --version
            npm --version
            pm2 --version
            echo "=== Navigating to project directory ==="
            cd /mnt/ext/projects/web3-governance-kit
            echo "Pulling latest changes from repository"
            git pull origin dev
            echo "Stopping Docker services"
            ./run.sh down
            echo "Starting Docker services"
            ./run.sh up-be
            echo "=== Navigating to frontend directory ==="
            cd /mnt/ext/projects/web3-governance-kit/frontend
            echo "Stopping frontend services"
            pm2 delete 0 || echo "No existing pm2 process to delete"
            echo "Building Frontend"
            npm run build
            echo "Starting frontend services"
            pm2 start "serve -s build/client -l 8080" --name fincube-frontend
            echo "Script executed successfully"
      - name: Notify Teams on Success
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "type": "AdaptiveCard",
                    "version": "1.0",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "✅ Fincube Deployment Successful",
                        "size": "Large",
                        "weight": "Bolder",
                        "color": "Good"
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          {
                            "title": "Repository:",
                            "value": "${{ github.repository }}"
                          },
                          {
                            "title": "Branch:",
                            "value": "${{ github.ref_name }}"
                          },
                          {
                            "title": "Commit:",
                            "value": "${{ github.sha }}"
                          },
                          {
                            "title": "Triggered by:",
                            "value": "${{ github.actor }}"
                          },
                          {
                            "title": "Workflow:",
                            "value": "${{ github.workflow }}"
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            }' \
            "${{ secrets.VM_WEBHOOK_URL }}"
      - name: Notify Teams on Failure
        if: failure()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "type": "AdaptiveCard",
                    "version": "1.0",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "❌ Fincube Deployment Failed",
                        "size": "Large",
                        "weight": "Bolder",
                        "color": "Attention"
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          {
                            "title": "Repository:",
                            "value": "${{ github.repository }}"
                          },
                          {
                            "title": "Branch:",
                            "value": "${{ github.ref_name }}"
                          },
                          {
                            "title": "Commit:",
                            "value": "${{ github.sha }}"
                          },
                          {
                            "title": "Triggered by:",
                            "value": "${{ github.actor }}"
                          },
                          {
                            "title": "Workflow:",
                            "value": "${{ github.workflow }}"
                          },
                          {
                            "title": "Action:",
                            "value": "Please check the workflow logs for details"
                          }
                        ]
                      }
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "View Workflow",
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }
                    ]
                  }
                }
              ]
            }' \
            "${{ secrets.VM_WEBHOOK_URL }}"
